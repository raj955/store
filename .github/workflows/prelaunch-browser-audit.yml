name: Prelaunch browser audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prelaunch-browser-audit.yml"
      - "wp-content/themes/store-child/**"
      - "wp-content/plugins/store-features/**"
  pull_request:
    paths:
      - ".github/workflows/prelaunch-browser-audit.yml"

permissions:
  contents: read

jobs:
  browser-audit:
    name: Desktop and mobile smoke audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.48.2 lighthouse
          npx playwright install --with-deps chromium
      - name: Audit live storefront without placing orders
        shell: bash
        run: |
          mkdir -p audit
          cat > audit.js <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const base = 'https://panuwear.com';
          const paths = ['/', '/shop/', '/my-account/', '/checkout/'];
          const results = [];
          (async () => {
            const browser = await chromium.launch({ headless: true });
            for (const view of [
              { name: 'desktop', viewport: { width: 1440, height: 900 }, isMobile: false },
              { name: 'mobile', viewport: { width: 390, height: 844 }, isMobile: true }
            ]) {
              const context = await browser.newContext({ viewport: view.viewport, isMobile: view.isMobile });
              const page = await context.newPage();
              page.on('pageerror', e => results.push({ view: view.name, type: 'pageerror', message: e.message }));
              page.on('response', response => {
                if (response.status() === 401 || response.status() >= 500) {
                  results.push({
                    view: view.name,
                    type: 'http-resource-error',
                    status: response.status(),
                    url: response.url().slice(0, 500),
                    resourceType: response.request().resourceType()
                  });
                }
              });
              page.on('console', m => {
                if (m.type() === 'error') results.push({ view: view.name, type: 'console-error', message: m.text().slice(0, 400) });
              });
              for (const path of paths) {
                const item = { view: view.name, path };
                try {
                  const response = await page.goto(base + path, { waitUntil: 'domcontentloaded', timeout: 45000 });
                  item.status = response ? response.status() : null;
                  await page.waitForLoadState('load', { timeout: 20000 }).catch(() => {});
                  item.finalUrl = page.url();
                  item.title = await page.title();
                  item.pageSummary = await page.evaluate(() => ({
                    heading: document.querySelector('h1')?.innerText?.trim().slice(0, 200) || null,
                    bodyTextStart: document.body?.innerText?.replace(/\\s+/g, ' ').trim().slice(0, 500) || '',
                    forms: [...document.forms].map(f => ({
                      id: f.id || null,
                      action: f.getAttribute('action'),
                      fields: [...f.querySelectorAll('input,select,textarea')].slice(0, 12).map(el => ({
                        name: el.name || null,
                        type: el.type || el.tagName.toLowerCase()
                      }))
                    })).slice(0, 5)
                  }));
                  item.metrics = await page.evaluate(() => ({
                    domReadyMs: Math.round(performance.timing.domContentLoadedEventEnd - performance.timing.navigationStart),
                    loadMs: Math.round(performance.timing.loadEventEnd - performance.timing.navigationStart),
                    htmlBytes: document.documentElement.outerHTML.length,
                    viewportWidth: window.innerWidth,
                    documentWidth: document.documentElement.scrollWidth,
                    horizontalOverflowPx: Math.max(0, document.documentElement.scrollWidth - window.innerWidth),
                    brokenImages: [...document.images].filter(img => img.complete && img.naturalWidth === 0).length
                  }));
                  await page.screenshot({ path: 'audit/' + (path.replace(/[^a-z0-9]+/gi, '-') || 'home') + '-' + view.name + '.png', fullPage: true }).catch(() => {});
                  if (item.status >= 400) item.failure = 'HTTP error';
                  if (item.metrics.horizontalOverflowPx > 1) item.warning = 'Horizontal overflow';
                } catch (e) {
                  item.failure = e.message;
                }
                results.push(item);
              }
              await context.close();
            }
            await browser.close();
            fs.writeFileSync('audit/report.json', JSON.stringify(results, null, 2));
            console.log(JSON.stringify(results, null, 2));
            if (results.some(x => x.failure || (x.status && x.status >= 500))) process.exitCode = 1;
          })();
          EOF
          node audit.js
      - name: Run Lighthouse PageSpeed audit (mobile and desktop)
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          for page in home shop; do
            if [ "$page" = "home" ]; then url="https://panuwear.com/"; else url="https://panuwear.com/shop/"; fi
            echo "---- Lighthouse $page MOBILE ----"
            npx lighthouse "$url" --chrome-flags="--headless --no-sandbox" --output=json --output-path="audit/lighthouse-${page}-mobile.json" --quiet
            echo "---- Lighthouse $page DESKTOP ----"
            npx lighthouse "$url" --preset=desktop --chrome-flags="--headless --no-sandbox" --output=json --output-path="audit/lighthouse-${page}-desktop.json" --quiet
          done
          node - <<'NODE'
          const fs = require('fs');
          for (const file of fs.readdirSync('audit').filter(f => f.startsWith('lighthouse-') && f.endsWith('.json'))) {
            const j = JSON.parse(fs.readFileSync('audit/' + file, 'utf8'));
            const a = j.audits || {};
            console.log(JSON.stringify({ report: file, performance: Math.round((j.categories?.performance?.score ?? 0) * 100), accessibility: Math.round((j.categories?.accessibility?.score ?? 0) * 100), bestPractices: Math.round((j.categories?.['best-practices']?.score ?? 0) * 100), seo: Math.round((j.categories?.seo?.score ?? 0) * 100), FCP: a['first-contentful-paint']?.displayValue, LCP: a['largest-contentful-paint']?.displayValue, CLS: a['cumulative-layout-shift']?.displayValue, TBT: a['total-blocking-time']?.displayValue, speedIndex: a['speed-index']?.displayValue }));
          }
          NODE
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panuwear-prelaunch-audit
          path: audit/
          if-no-files-found: ignore
