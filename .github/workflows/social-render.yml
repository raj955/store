# Makes the Instagram/Facebook reels for marketing/queue/*.json (product photos from the live
# store + Hindi voice), uploads them to wp-content/uploads/sf-social/ by FTP, and updates the
# posting list the website reads (store-features/social/queue.json). The website posts them at
# their time; this workflow only prepares them.
name: Social reels

on:
  push:
    branches: [main]
    paths:
      - "marketing/queue/**"
      - "marketing/render/**"
      - ".github/workflows/social-render.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Post ids to render again (space separated, or 'all')"
        default: ""

permissions:
  contents: write

concurrency:
  group: social-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
      FTP_BASE_DIR: ${{ secrets.FTP_BASE_DIR }}
      FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji ffmpeg >/dev/null
          pip install -q edge-tts==7.0.2
          cd marketing/render && npm i --silent && npx playwright install chromium >/dev/null
      - name: Render and upload
        working-directory: marketing/render
        run: node render.mjs
      - name: Save the posting list
        run: |
          git config user.name "social-bot"
          git config user.email "social-bot@users.noreply.github.com"
          git add wp-content/plugins/store-features/social/queue.json
          git diff --cached --quiet || (git commit -qm "Social: reels ready [skip ci]" && git pull -q --rebase && git push -q)
