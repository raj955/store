# Makes the Instagram/Facebook reels for marketing/queue/*.json (product photos from the live
# store + Hindi voice), uploads them to wp-content/uploads/sf-social/ by FTP, and updates the
# posting list the website reads (store-features/social/queue.json). The website posts them at
# their time; this workflow only prepares them.
name: Social reels

on:
  push:
    branches: [main]
    paths:
      - "marketing/queue/**"
      - "marketing/render/**"
      - ".github/workflows/social-render.yml"
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Post ids to render again (space separated, or 'all')"
        default: ""

permissions:
  contents: write

concurrency:
  group: social-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
      FTP_BASE_DIR: ${{ secrets.FTP_BASE_DIR }}
      FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji ffmpeg >/dev/null
          pip install -q -U edge-tts gTTS
          cd marketing/render && npm i --silent && npx playwright install chromium >/dev/null
      - name: List the products on sale (for the weekly post planner)
        run: |
          node -e '
            (async()=>{ const all=[]; for(let p=1;p<6;p++){ const r=await fetch("https://panuwear.com/wp-json/wc/store/v1/products?per_page=100&page="+p,{headers:{"User-Agent":"Mozilla/5.0"}}); if(!r.ok) break; const j=await r.json(); if(!j.length) break; all.push(...j); }
            const out=all.filter(p=>p.is_purchasable!==false).map(p=>({slug:p.slug,name:p.name,price:Math.round(p.prices.price/10**(p.prices.currency_minor_unit||0)),categories:p.categories.map(c=>c.slug),photos:p.images.length,custom:/design-your-own/.test(p.slug)}));
            require("fs").writeFileSync("marketing/products.json", JSON.stringify(out,null,1)); console.log(out.length+" products"); })()'
      - name: Render and upload
        working-directory: marketing/render
        shell: bash
        run: |
          set -o pipefail
          node render.mjs 2>&1 | tee render.log
      - name: Save the posting list
        run: |
          git config user.name "social-bot"
          git config user.email "social-bot@users.noreply.github.com"
          git add wp-content/plugins/store-features/social/queue.json marketing/products.json
          git diff --cached --quiet || (git commit -qm "Social: reels ready [skip ci]" && git pull -q --rebase && git push -q)
      - name: Keep the log (shots branch, social/render.log)
        if: always()
        run: |
          mkdir -p /tmp/logs/social && cp marketing/render/render.log /tmp/logs/social/ 2>/dev/null || echo "no log" > /tmp/logs/social/render.log
          cp marketing/render/out/*.jpg /tmp/logs/social/ 2>/dev/null || true
          cd /tmp/logs && git init -q -b shots && git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -qm "social log" && git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" shots:social-log
