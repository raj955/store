name: Site clock
# Wakes the website's scheduler every 15 minutes so social posts, cart reminders and photo/price
# fixes run on time even when nobody is visiting the site (e.g. late at night).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -sS -m 60 -o /dev/null -w "%{http_code}\n" -A "PanuwearClock/1.0" "https://panuwear.com/wp-cron.php?doing_wp_cron=$(date +%s)"
